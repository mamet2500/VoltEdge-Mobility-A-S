services:
  api:
    build: .
    container_name: voltedge_api
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: voltedge_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: PAF271298
      MYSQL_DATABASE: voltedge_monitoring
    ports:
      - "3307:3306"
    volumes:
      - ./voltedge_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: